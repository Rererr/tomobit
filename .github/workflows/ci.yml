name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 顔窓(cmd/tomobit-face)は Ebiten を使うので Linux ではシステムライブラリが要る。
      # 主CLI(cmd/tomobit)は stdlib のみで、この依存は伝播しない(ADR-0048)。
      - name: Install Ebiten build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6-dev libglu1-mesa-dev libgl1-mesa-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev \
            libasound2-dev pkg-config

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...
