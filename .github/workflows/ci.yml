name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ドキュメント検査はGoに依存しないので、test行列とは別ジョブにする。
  # 2OSで同じ結果を2度出す意味も無い。
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cross-repoリンク（GUIのADRや実装ファイルを指すURL）の参照先を見るため、
      # 隣のリポジトリも並べる。checkout は workspace の外へ置けないので、
      # $ADR_LINK_SIBLINGS で探す場所をここへ向ける。
      - uses: actions/checkout@v4
        with:
          repository: Rererr/tomobit-gui
          path: _siblings/tomobit-gui

      # ADRの `関連:` ブロックは参照先の表題の記憶から書かれがちで、
      # ファイル名とずれても人間の目には読めてしまう。機械で見る。
      - name: ADRリンクの参照先
        run: make docs-check
        env:
          ADR_LINK_SIBLINGS: _siblings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 顔窓(cmd/tomobit-face)は Ebiten を使うので Linux ではシステムライブラリが要る。
      # 主CLI(cmd/tomobit)は stdlib のみで、この依存は伝播しない(ADR-0048)。
      - name: Install Ebiten build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6-dev libglu1-mesa-dev libgl1-mesa-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev \
            libasound2-dev pkg-config

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # ビルドは全パッケージ。Linuxでも顔窓が「コンパイルは通る」ことは保証する。
      - name: go build
        run: go build ./...

      # 競合検出器はmacOSジョブだけで走らせる。ADR-0056 が並走を既定にした以上
      # 守りが要る一方（runGroupParallel の goroutine が ndjsonStream.emit と
      # turnView を共有する）、競合はOS非依存なので2度見る意味は薄く、検出器は
      # 実行を数倍遅くする。docs検査を別ジョブにしたのと同じ理由。
      - name: go test (macOS — 全パッケージ・競合検出つき)
        if: runner.os == 'macOS'
        run: go test -race ./...

      # Linuxのランナーには表示コンテキストが無く、Ebitenは
      # `panic: glfw: The GLFW library is not initialized` で落ちる(実測)。
      # xvfbで通すこともできるが、Linuxで顔窓を実際に動かす利用者はまだ居らず、
      # 通したところで「動く」の証拠にはならない。GL依存の2パッケージだけ外し、
      # 端末CLI — Linuxで本当に動いてほしい部分 — はすべて検証する。
      # ADR-0048「Ebiten依存を端末利用者へ伝播させない」の、CI側での対応物。
      - name: go test (Linux — GL依存の2パッケージを除く)
        if: runner.os == 'Linux'
        run: |
          go test $(go list ./... \
            | grep -v -e '/cmd/tomobit-face$' -e '/internal/facewin$')
